name: Run the workspace gates
description: Every gate, over one workspace -- the same entry point a contributor runs.

inputs:
  workspace:
    description: The checkout to act on.
    required: true
  tooling:
    description: >-
      Where the tooling comes from, as a requirement `uvx --from` accepts --
      `git+https://github.com/siegenthalerroger/.llmctl@main` for a workspace
      that holds none of it. Empty runs the workspace's own project, locked.
    required: false
    default: ""
  since:
    description: >-
      The base of the commit range to lint. Empty, or an all-zero sha from a
      branch that did not exist yet, skips that gate rather than inventing a range.
    required: false
    default: ""
  subject:
    description: An extra subject to lint, such as a pull request title.
    required: false
    default: ""
  github-token:
    description: Read access for the pack gate, which installs the pinned upstreams.
    required: true

runs:
  using: composite
  steps:
    - name: Run the gates
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        TOOLING: ${{ inputs.tooling }}
        SINCE: ${{ inputs.since }}
        SUBJECT: ${{ inputs.subject }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        args=(--repo .)
        if [ -n "$SINCE" ] && [ "$SINCE" != "0000000000000000000000000000000000000000" ]; then
          args+=(--since "$SINCE")
          if [ -n "$SUBJECT" ]; then args+=(--subject "$SUBJECT"); fi
        fi
        if [ -n "$TOOLING" ]; then run=(uvx --from "$TOOLING"); else run=(uv run --locked); fi
        "${run[@]}" llmctl-check "${args[@]}"
