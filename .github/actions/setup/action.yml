# Used by this repo's workflows, by path, and by the private workspace's, which
# names it as `siegenthalerroger/.llmctl/.github/actions/setup@main`: this
# repository is public, so that needs no checkout and no permission.
name: Set up uv and APM
description: Install uv and the APM CLI, the two things every job here needs.

inputs:
  apm-version:
    description: >-
      The APM CLI to install. The default is the pin every job here runs,
      gates and releases alike: what a bundle contains depends on the packer
      that made it, so the gates have to pass on the version that will pack it.
      Moving the pin is a commit, and the gates on it are the proof.
    required: false
    default: "0.31.0"
  cache-dependency-glob:
    description: >-
      What the uv cache is keyed on. The default is this project's own
      resolution; a workspace that runs the tooling from git names the file
      that says which ref, since it has no lockfile to name.
    required: false
    default: |
      **/pyproject.toml
      **/uv.lock

outputs:
  apm-version:
    description: The APM version that was installed.
    value: ${{ steps.apm.outputs.apm-version }}

runs:
  using: composite
  steps:
    - name: Install uv
      # Pinned to a full version on purpose: setup-uv stopped publishing major
      # and minor tags at v8, so `@v10` does not resolve.
      uses: astral-sh/setup-uv@v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}

    - name: Install the APM CLI
      id: apm
      uses: microsoft/apm-action@v1
      with:
        setup-only: true
        apm-version: ${{ inputs.apm-version }}
