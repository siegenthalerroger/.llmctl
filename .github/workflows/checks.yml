name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:17 UTC. Off the hour to reduce queueing.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: release gates
    runs-on: ubuntu-latest
    env:
      # Ensure apm commands use authenticated Github API calls.
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v5
        with:
          path: .llmctl
          # The parity gate dates each tracked file from its last commit, and
          # release tags are the baseline for everything version-shaped.
          fetch-depth: 0

      - name: Install the APM CLI
        id: apm
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          # Ensure breaking changes are caught early.
          apm-version: latest

      - name: Deploy from the lockfile
        # `--frozen` reproduces apm.lock.yaml exactly, which is what the
        # lockfile gate then audits. The targets are explicit because the repo
        # carries signals for several harnesses and APM refuses to guess.
        run: apm install --frozen --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the release gates
        # The same entry point a contributor runs. No marketplace sibling is
        # checked out, so the marketplace gates skip and say so -- they check
        # that repo against itself and only move when a release writes to it.
        run: apm run release-check
        working-directory: .llmctl
        env:
          # The parity gate runs the drift audit, which reads the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Say which APM ran
        # `apm-version: latest` is the point of the scheduled run, so a red
        # Monday needs to name the version that turned it red.
        if: always()
        run: echo "APM ${{ steps.apm.outputs.apm-version }}" >> "$GITHUB_STEP_SUMMARY"
