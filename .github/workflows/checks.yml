# Every release gate, on every change and once a week.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:17 UTC. Off the hour: scheduled runs pile up on :00 across
    # GitHub and get queued.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: release gates
    runs-on: ubuntu-latest
    env:
      # `setup-only` installs the CLI and returns, so apm-action never gets to
      # forward its own token: without this every upstream fetch below is
      # anonymous, against a 60-request hourly limit shared with every other
      # job on the runner's IP.
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v5
        with:
          path: .llmctl
          # The parity gate dates each tracked file from its last commit, and
          # release tags are the baseline for everything version-shaped.
          fetch-depth: 0

      - name: Check out the marketplace
        uses: actions/checkout@v5
        # The marketplace is a separate (currently private) repo. Without a
        # token that can read it, release-check skips the four marketplace
        # gates and says so -- which is better than failing every run on a
        # missing secret. Set MARKETPLACE_TOKEN to get them.
        continue-on-error: true
        with:
          repository: siegenthalerroger/.llmctl-marketplace
          path: .llmctl-marketplace
          fetch-depth: 0
          token: ${{ secrets.MARKETPLACE_TOKEN || github.token }}

      - name: Install the APM CLI
        id: apm
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          working-directory: .llmctl
          # Deliberately floating, and the point of the scheduled run: the
          # gates should fail when a new APM breaks this repo's deployment.
          apm-version: latest

      - name: Deploy from the lockfile
        # `--frozen` reproduces apm.lock.yaml exactly, which is what the
        # lockfile gate then audits. The targets are explicit because the repo
        # carries signals for several harnesses and APM refuses to guess.
        run: apm install --frozen --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the release gates
        run: python3 scripts/release-check.py --repo . --marketplace ../.llmctl-marketplace
        working-directory: .llmctl
        env:
          # The parity gate runs the drift audit, which reads the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Say which APM ran
        # `apm-version: latest` is the point of the scheduled run, so a red
        # Monday needs to name the version that turned it red.
        if: always()
        run: echo "APM ${{ steps.apm.outputs.apm-version }}" >> "$GITHUB_STEP_SUMMARY"
