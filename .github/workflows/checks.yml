# Every gate, on every pull request.
name: checks

on:
  pull_request:
  workflow_dispatch:

# A push to main runs the same gates inside release.yml, immediately before the
# release itself, so it is not duplicated here.

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: workspace gates
    runs-on: ubuntu-latest
    env:
      # Ensure apm commands use authenticated GitHub API calls.
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Check out the workspace
        uses: actions/checkout@v7
        with:
          path: .llmctl
          # The commit gate reads the range back to the pull request's base, and
          # the pack gate dates each package from its last release tag.
          fetch-depth: 0

      - name: Set up uv and APM
        uses: ./.llmctl/.github/actions/setup

      - name: Deploy this repo's own primitives from the lockfile
        run: apm install --frozen --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the gates
        uses: ./.llmctl/.github/actions/gates
        with:
          workspace: .llmctl
          since: ${{ github.event.pull_request.base.sha }}
          subject: ${{ github.event.pull_request.title }}
          github-token: ${{ github.token }}
