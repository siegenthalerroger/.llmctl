# Cut a release, on demand.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show the derived bumps and write nothing"
        type: boolean
        default: true
      packages:
        description: "Only these packages, space-separated (blank = every package with commits)"
        type: string
        default: ""
      bump:
        description: "Force a level instead of deriving it from the commits"
        type: choice
        options: [derive, patch, minor, major]
        default: derive

# The release commit reaches main through a pull request, because main is
# protected and no token here holds a bypass. That pull request is opened with
# RELEASE_TOKEN rather than GITHUB_TOKEN, so these permissions cover only the
# steps that still read the API as the workflow itself.
permissions:
  contents: read

# Never two releases at once: both derive versions from tags that the other one
# is in the middle of creating.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `setup-only` installs the CLI and returns, so apm-action never gets to
      # forward its own token: without this every upstream fetch below is
      # anonymous, against a 60-request hourly limit shared with every other
      # job on the runner's IP.
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Require a marketplace token
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "::error::.llmctl-marketplace is private and a release pushes" \
                 "to it, so even a dry run has to read it. Set the" \
                 "MARKETPLACE_TOKEN secret to a token with contents:write on it."
            exit 1
          fi

      - name: Require a release token
        env:
          # Compared as a string, like the step above: a workflow_dispatch
          # boolean reaches an `if:` expression typed inconsistently enough that
          # `== false` is not worth trusting a release to.
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::A release opens a pull request against protected" \
                 "main. GITHUB_TOKEN cannot: this repo is public, so a pull" \
                 "request authored by github-actions[bot] holds its checks" \
                 "behind the outside-contributor approval gate and the release" \
                 "stalls waiting for a human. Set RELEASE_TOKEN to a token" \
                 "owned by a collaborator, with contents:write and" \
                 "pull-requests:write on this repo."
            exit 1
          fi

      - name: Check out the workspace
        uses: actions/checkout@v5
        with:
          path: .llmctl
          # release.py measures each package from its last tag; a shallow or
          # tagless clone measures from the start of history and over-bumps.
          fetch-depth: 0
          # Persisted for the release branch push, so the branch and the pull
          # request opened from it carry one identity. Falls back to the
          # workflow token on a dry run, which pushes nothing.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check out the marketplace
        uses: actions/checkout@v5
        with:
          repository: siegenthalerroger/.llmctl-marketplace
          path: .llmctl-marketplace
          fetch-depth: 0
          # The only cross-repo write in this workflow, and the only thing
          # MARKETPLACE_TOKEN needs to reach.
          token: ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Install the APM CLI
        id: apm
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          # Deliberately floating, and the point of the scheduled run: the
          # gates should fail when a new APM breaks this repo's deployment.
          apm-version: latest

      - name: Check the repo still deploys
        # Feeds no gate. With `apm-version: latest` this is what catches an APM
        # release that breaks deployment. Targets are explicit: several harnesses.
        run: apm install --frozen --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the workspace gates
        # Both halves run here, and only here: checks.yml has no marketplace to
        # check out, so this is the one place the full set is enforced.
        run: apm run check
        working-directory: .llmctl
        env:
          # The parity gate runs the drift audit, which reads the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run the release gates
        # Reads the marketplace checked out above, and refuses to run without it.
        run: apm run release-check
        working-directory: .llmctl
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Identify the committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: .llmctl
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGES: ${{ inputs.packages }}
          BUMP: ${{ inputs.bump }}
          # gh reads GH_TOKEN first. It has to be the release token, not the
          # workflow one: the pull request's author decides whether its checks
          # need approving, and github-actions[bot] is an outside contributor
          # on a public repo. Authored by a collaborator, they just run.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # GITHUB_TOKEN is deliberately absent: gh falls back to it, which would
          # quietly restore the bot-authored pull request this step exists to
          # avoid. Missing RELEASE_TOKEN should fail, not degrade.
        run: |
          set -euo pipefail
          # --allow-dirty because the deploy check above rewrites
          # apm.lock.yaml whenever tracked content moved without a lockfile
          # refresh, which is most releases. release.py lists what it sweeps.
          args=(--repo . --marketplace ../.llmctl-marketplace --allow-dirty)
          # A dry run writes nothing and so has no commit to merge; asking for a
          # pull request there would only fail on an empty branch.
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); else args+=(--pull-request); fi
          if [ "$BUMP" != "derive" ]; then args+=(--bump "$BUMP"); fi
          for package in $PACKAGES; do args+=(--package "$package"); done
          echo "release.py ${args[*]}"
          python3 scripts/release.py "${args[@]}" | tee "$RUNNER_TEMP/release.log"
          {
            echo "## Release"
            echo
            echo "Packed with APM ${{ steps.apm.outputs.apm-version }}."
            echo
            echo '```'
            cat "$RUNNER_TEMP/release.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
