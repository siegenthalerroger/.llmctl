# Release whatever the push changed, then publish it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be released and write nothing"
        type: boolean
        default: true
      packages:
        description: "Force these packages, space-separated (blank = whatever has commits)"
        type: string
        default: ""
      version:
        description: "Release the single package above at exactly this YYYY.M.N"
        type: string
        default: ""

# A release writes nothing to this repository: it pushes annotated tags and
# creates the releases beside them, both of which `contents: write` covers.
# There is no branch push, so protected main needs no bypass and no pull
# request, and a tag push starts no further workflow.
permissions:
  contents: write

# Never two releases at once: both derive versions from tags the other is in
# the middle of creating.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Require a marketplace token
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "::error::A release regenerates and pushes .llmctl-marketplace," \
                 "so even a dry run has to read it. Set the MARKETPLACE_TOKEN" \
                 "secret to a token with contents:write on it."
            exit 1
          fi

      - name: Check out the workspace
        uses: actions/checkout@v5
        with:
          path: .llmctl
          # Each package is measured from its last tag, and packed from HEAD; a
          # shallow or tagless clone measures from the start of history.
          fetch-depth: 0

      - name: Check out the marketplace
        uses: actions/checkout@v5
        with:
          repository: siegenthalerroger/.llmctl-marketplace
          path: .llmctl-marketplace
          fetch-depth: 0
          # The only cross-repo write in this workflow, and the only thing
          # MARKETPLACE_TOKEN needs to reach.
          token: ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # major and minor tags at v8, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: ".llmctl/scripts/*.py"

      - name: Install the APM CLI
        id: apm
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: latest

      - name: Deploy this repo's own primitives from the lockfile
        run: apm install --frozen --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the gates
        # Every gate, immediately before publishing what they passed on.
        working-directory: .llmctl
        env:
          SINCE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo .)
          # An all-zero `before` is a branch that did not exist yet; there is no
          # range to lint, so the commit gate is skipped rather than invented.
          if [ -n "$SINCE" ] && [ "$SINCE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--since "$SINCE")
          fi
          uv run scripts/check.py "${args[@]}"

      - name: Identify the committer
        # Only the marketplace commit carries an author: this repo is tagged,
        # never committed to.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        working-directory: .llmctl
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PACKAGES: ${{ inputs.packages }}
          VERSION: ${{ inputs.version }}
          # Tags, and the GitHub release beside each one.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--repo . --marketplace ../.llmctl-marketplace)
          # A push releases; a dispatch previews unless told otherwise.
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          for package in $PACKAGES; do args+=(--package "$package"); done
          if [ -n "$PACKAGES" ]; then args+=(--force); fi
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          echo "release.py ${args[*]}"
          uv run scripts/release.py "${args[@]}" | tee "$RUNNER_TEMP/release.log"
          {
            echo "## Release"
            echo
            echo "Packed with APM ${{ steps.apm.outputs.apm-version }}."
            echo
            echo '```'
            cat "$RUNNER_TEMP/release.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
