# Release whatever the push changed, then publish it.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be released and write nothing"
        type: boolean
        default: true
      packages:
        description: "Force these packages, space-separated (blank = whatever has commits)"
        type: string
        default: ""
      version:
        description: "Exact YYYY.M.N to release at; needs exactly one package above"
        type: string
        default: ""

# Annotated tags and the GitHub Releases beside them are the only writes this
# workflow makes here, and both need `contents: write`.
permissions:
  contents: write

# Never two releases at once: both derive versions from tags the other is in
# the middle of creating.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_APM_PAT: ${{ github.token }}
    steps:
      - name: Require a marketplace token
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$MARKETPLACE_TOKEN" ]; then
            echo "::error::A release regenerates and pushes .llmctl-marketplace," \
                 "so even a dry run has to read it. Set the MARKETPLACE_TOKEN" \
                 "secret to a token with contents:write on it."
            exit 1
          fi

      - name: Check out the workspace
        uses: actions/checkout@v7
        with:
          path: .llmctl
          # Each package is measured from its last tag, and packed from HEAD; a
          # shallow or tagless clone measures from the start of history.
          fetch-depth: 0

      - name: Check out the marketplace
        uses: actions/checkout@v7
        with:
          repository: siegenthalerroger/.llmctl-marketplace
          path: .llmctl-marketplace
          fetch-depth: 0
          # The only cross-repo write in this workflow, and the only thing
          # MARKETPLACE_TOKEN needs to reach.
          token: ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Set up uv and APM
        id: setup
        uses: ./.llmctl/.github/actions/setup

      - name: Deploy this repo's own primitives
        # Not `--frozen`: APM 0.31 cannot restore a package that declares MCP
        # servers into an empty `apm_modules/`, and `packages/core` declares
        # two. The `lockfiles` gate is what holds every lockfile to its pins.
        run: apm install --target claude,codex,agent-skills
        working-directory: .llmctl

      - name: Run the gates
        # Every gate, immediately before publishing what they passed on.
        uses: ./.llmctl/.github/actions/gates
        with:
          workspace: .llmctl
          since: ${{ github.event.before }}
          github-token: ${{ github.token }}

      - name: Release
        uses: ./.llmctl/.github/actions/release
        with:
          workspace: .llmctl
          marketplace: ../.llmctl-marketplace
          dry-run: ${{ inputs.dry_run }}
          packages: ${{ inputs.packages }}
          version: ${{ inputs.version }}
          github-token: ${{ github.token }}
          apm-version: ${{ steps.setup.outputs.apm-version }}
