# The release tooling, as one project: one dependency set, one lockfile, one
# console script per command. This checkout runs it with `uv run llmctl-check`;
# a workspace that holds no tooling runs the same commands from git with
# `uvx --from git+https://github.com/siegenthalerroger/.llmctl@main llmctl-check`.
# It is never published to an index, so the version is a placeholder, as the
# packages' are.
[project]
name = "llmctl"
version = "0.0.0"
description = "Gates, packing, releasing and updating for an APM steering workspace."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Exact pins on purpose: a workspace installing from git resolves against this
# table, not against uv.lock, so these are what hold its environment to ours.
dependencies = [
  "httpx==0.28.1",
  "python-frontmatter==1.3.0",
  "rich==15.0.0",
  "ruamel.yaml==0.19.1",
  "typer==0.27.2",
]

# One command per entry, in the order apm.yml lists them; the last two are the
# pieces the pack and the release run, kept callable on their own.
[project.scripts]
llmctl-check = "llmctl.check:cli"
llmctl-check-frontmatter = "llmctl.check_frontmatter:cli"
llmctl-update = "llmctl.update:cli"
llmctl-check-updates = "llmctl.check_updates:cli"
llmctl-check-steering = "llmctl.check_steering:cli"
llmctl-versions = "llmctl.versions:cli"
llmctl-release = "llmctl.release:cli"
llmctl-pack-marketplace = "llmctl.pack_marketplace:cli"
llmctl-check-licenses = "llmctl.check_licenses:cli"
llmctl-gen-notices = "llmctl.gen_notices:cli"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
# Reproducible resolution without re-locking on every run: nothing newer than
# this date is considered. Move it when the pins above move.
exclude-newer = "2026-09-18T00:00:00Z"
