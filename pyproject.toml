# The release tooling, as one project: one dependency set, one lockfile, one
# console script per command. This checkout runs it with `uv run llmctl-check`;
# a workspace that holds no tooling runs the same commands from git with
# `uvx --from git+https://github.com/siegenthalerroger/.llmctl@main llmctl-check`.
# It is never published to an index, so the version is a placeholder, as the
# packages' are.
[project]
name = "llmctl"
version = "0.0.0"
description = "Gates, packing, releasing and updating for an APM steering workspace."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Exact pins on purpose: a workspace installing from git resolves against this
# table, not against uv.lock, so these are what hold its environment to ours.
dependencies = [
  "httpx==0.28.1",
  "python-frontmatter==1.3.0",
  "rich==15.0.0",
  "ruamel.yaml==0.19.1",
  "typer==0.27.2",
]

# One command per entry, in the order apm.yml lists them; the last two are the
# pieces the pack and the release run, kept callable on their own.
[project.scripts]
llmctl-check = "llmctl.check:cli"
llmctl-check-frontmatter = "llmctl.check_frontmatter:cli"
llmctl-update = "llmctl.update:cli"
llmctl-check-updates = "llmctl.check_updates:cli"
llmctl-check-steering = "llmctl.check_steering:cli"
llmctl-versions = "llmctl.versions:cli"
llmctl-release = "llmctl.release:cli"
llmctl-pack-marketplace = "llmctl.pack_marketplace:cli"
llmctl-check-licenses = "llmctl.check_licenses:cli"
llmctl-gen-notices = "llmctl.gen_notices:cli"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
# Reproducible resolution without re-locking on every run: nothing newer than
# this date is considered. Move it when the pins above move.
exclude-newer = "2026-09-18T00:00:00Z"

# Pinned like the runtime dependencies, and moved by the same procedure. These
# never reach a workspace that installs from git -- a dependency group is not
# wheel metadata -- so they hold only this checkout and CI to one linter.
[dependency-groups]
dev = [
  "ruff==0.16.8",
  "ty==0.0.82",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

# Curated families rather than `select = ["ALL"]`: every rule below is one this
# code should hold to, so a finding is a defect and not a style opinion to
# argue with in an ignore list.
[tool.ruff.lint]
select = [
  "F",    # pyflakes -- what this gate checked before ruff replaced it
  "E", "W",   # pycodestyle
  "I",    # import order
  "UP",   # pyupgrade: the floor is 3.11, so say so in the syntax
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplifications
  "PTH",  # pathlib over os.path -- a python-standards rule
  "RET",  # returns: the early-return shape python-standards asks for
  "ARG",  # unused arguments
  "TID",  # tidy imports
  "S",    # bandit
  "PL",   # pylint
  "RUF",  # ruff's own
]
ignore = [
  # A command's arguments are its flags: typer builds the parser from the
  # signature, so the count and the `= Option(...)` defaults are the API.
  # Only the `main()` of each entry module trips these; the library functions
  # behind them are keyword-only past their second argument.
  "PLR0913",  # too-many-arguments
  "PLR0917",  # too-many-positional-arguments
  "B008",     # function-call-in-default-argument
  # Every subprocess call here passes a literal list; none is built from input.
  # The tools are looked up on PATH on purpose, so a workspace can run its own.
  "S603",     # subprocess-without-shell-equals-true
  "S607",     # start-process-with-partial-path
  # `except Exception` is the contract in two places: a gate must not take the
  # run down, and a hook must not block an edit. Both re-report what they caught.
  "BLE001",   # blind-except
]

[tool.ruff.lint.pylint]
# A status classifier returns one row per outcome, and `check_updates` has
# seven. Naming the outcome in a variable to return it once at the bottom hides
# exactly what the function is for.
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# The runner turns any exception into a failed gate, so the gates deliberately
# assert nothing and let the caller see the message.
"src/llmctl/gates.py" = ["S110"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
# The package lives under src/, so that is the first-party root ty resolves
# `llmctl.*` against -- not the project directory the checkout sits in.
root = ["./src"]
