name: llmctl-core
version: 0.2.0
description: Core agent steering — domain-neutral planning, exploration and execution agents, research, troubleshooting, diagramming.
author: siegenthalerroger

# Include all items in this package's `.apm/` directory.
includes: auto

dependencies:
  apm:
    # mattpocock/skills (MIT) — requirement extraction before planning:
    # `grilling` is the reusable model-invoked loop, `grill-me` the /-entry
    # point. Complements the `plan` agent, which researches and plans but never
    # interrogates the request first.
    - mattpocock/skills/skills/productivity/grilling#2ab958093e83e0ec752e6c1c5932da465bf23e0c
    - mattpocock/skills/skills/productivity/grill-me#2ab958093e83e0ec752e6c1c5932da465bf23e0c
    # blader/humanizer (MIT) — prose de-slopping for README/CONTRIBUTING/PRD
    # text: 33 numbered patterns from Wikipedia's "Signs of AI writing".
    - blader/humanizer#523374dee72d67c7b2b5f858ea0094ffda49c3ac
  mcp:
    # Universal dev MCPs, kept in the global baseline. Domain doc MCPs
    # (opentofu-registry, aws-knowledge-mcp, microsoft.docs.mcp) live in
    # packages/ops so they only load in ops/infra projects.
    #
    # shuymn/gh-mcp `gh` CLI extension: wraps the official github-mcp-server binary and reuses your `gh` login — no PAT needed.
    # Optional env: GITHUB_TOOLSETS, GITHUB_READ_ONLY, GITHUB_DYNAMIC_TOOLSETS.
    - name: github
      registry: false
      transport: stdio
      command: gh
      args: ["mcp"]
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
