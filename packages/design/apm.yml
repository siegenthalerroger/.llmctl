name: llmctl-design
displayName: llmctl Design
version: 0.0.0
description: Collaborative design work; direction-setting, colour, typography and presentation skills, plus layout, identity and data-visualisation practice.
author:
  name: siegenthalerroger
  url: https://github.com/siegenthalerroger
license: MIT AND CC-BY-SA-4.0
homepage: https://github.com/siegenthalerroger/.llmctl-marketplace
repository: https://github.com/siegenthalerroger/.llmctl
keywords: [skills, design, colour, typography, layout, data-visualisation]
category: Design

# Include all items in this package's `.apm/` directory
includes: auto

dependencies:
  # The layout, identity and dataviz skills are vendored under .apm/skills/ from
  # Design-Machines-Studio/depot (Unlicense) at ab34ce69, the commit this package
  # last pinned: the `design-practice` plugin by Travis Gertz (ex-Louder Than Ten),
  # taken for the three domains where it teaches derivation instead of handing over
  # values. The upstream repository was deleted or made private between 2026-10-18
  # and 2026-10-30, so it can no longer be installed; each vendored file records the
  # upstream path in its own `metadata.provenance`.
  # Deliberately left behind:
  #   - `typography` skill — the local `typography` skill covers this.
  #   - `design-machines` plugin — the local `design-direction` skill covers this.
  #   - `accessibility-*` plugin — the local `colour` skill and specific accessibility checks cover this.
  #   - every other depot plugin — non-design domains.
  apm: []
  mcp: []
