name: llmctl-ops
displayName: llmctl Ops
version: 0.0.0
description: Confidently hand off infrastructure work. Helm, Kubernetes and OpenTofu/Terraform skills, path-scoped conventions, and cloud and IaC documentation connectors.
author:
  name: siegenthalerroger
  url: https://github.com/siegenthalerroger
license: MIT AND CC-BY-SA-4.0
homepage: https://github.com/siegenthalerroger/.llmctl-marketplace
repository: https://github.com/siegenthalerroger/.llmctl
keywords: [skills, instructions, connectors, mcp, devops, kubernetes, helm, terraform, opentofu]
category: DevOps

# Include all items in this package's `.apm/` directory.
includes: auto

dependencies:
  apm:
    # antonbabenko/terraform-skill (Apache-2.0) — the operational half of
    # TF work: Complementary to the local `tf-standards` skill.
    - antonbabenko/terraform-skill/skills/terraform-skill#0a3a4a66e99001347d36a41e10260a825be3ab62

  # Cloud / IaC documentation MCPs (read only) — scoped here rather than the
  # global baseline so their tool surface only loads in ops/infra projects.
  mcp:
    - name: opentofu-registry
      registry: false
      transport: streamable-http
      url: https://mcp.opentofu.org/mcp
    - name: microsoft.docs.mcp
      registry: false
      transport: streamable-http
      url: https://learn.microsoft.com/api/mcp
    - name: aws-knowledge-mcp
      registry: false
      transport: http
      url: https://knowledge-mcp.global.api.aws
