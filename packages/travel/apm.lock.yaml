mcp_servers:
- airbnb
- ferryhopper
- fli
- hotelrate
- liteapi
- skiplagged
- trivago
mcp_configs:
  airbnb:
    name: airbnb
    transport: stdio
    args:
    - -y
    - '@openbnb/mcp-server-airbnb@0.3.0'
    - --ignore-robots-txt
    registry: false
    command: npx
  ferryhopper:
    name: ferryhopper
    transport: http
    registry: false
    url: https://mcp.ferryhopper.com/mcp
  fli:
    name: fli
    transport: stdio
    args:
    - --from
    - flights[mcp]==0.9.0
    - fli-mcp
    registry: false
    command: uvx
  hotelrate:
    name: hotelrate
    transport: stdio
    args:
    - --with
    - mcp[cli]<2
    - --from
    - git+https://github.com/seanbabalala/hotelrate-crawl@b60205201f002d649ef741fcfe1f6130123289e6
    - hotelrate-mcp
    registry: false
    command: uvx
  liteapi:
    name: liteapi
    transport: http
    registry: false
    headers:
      Authorization: Bearer ${LITEAPI_API_KEY}
    url: https://mcp.liteapi.travel/api/mcp
  skiplagged:
    name: skiplagged
    transport: http
    registry: false
    url: https://mcp.skiplagged.com/mcp
  trivago:
    name: trivago
    transport: http
    registry: false
    url: https://mcp.trivago.com/mcp
mcp_target_servers:
  claude:
  - airbnb
  - ferryhopper
  - fli
  - hotelrate
  - liteapi
  - skiplagged
  - trivago
