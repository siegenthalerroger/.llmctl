name: llmctl-travel
displayName: llmctl Travel
version: 0.0.0
description: Travel steering — destination timing intelligence (public/school holidays and major events), trip planning, entry requirements, itinerary authoring, plus flight, hotel, ferry and stay search MCP servers.
author: siegenthalerroger
license: MIT AND CC-BY-SA-4.0

# Include all items in this package's `.apm/` directory.
includes: auto

dependencies:
  apm: []
  # Travel search servers, scoped here rather than the global baseline so this
  # tool surface only loads in travel contexts. A server that cannot start or
  # has no credentials degrades to web search as defined by trip-planning skill.
  mcp:
    # The only credible Google Flights route.
    - name: fli
      registry: false
      transport: stdio
      command: uvx
      args: ["--from", "flights[mcp]==0.9.0", "fli-mcp"]
    # Flights, including hidden-city itineraries no mainstream OTA will surface.
    # Also carries hotels and cars.
    - name: skiplagged
      registry: false
      transport: http
      url: https://mcp.skiplagged.com/mcp
    # Ferries. Nothing else here covers them.
    - name: ferryhopper
      registry: false
      transport: http
      url: https://mcp.ferryhopper.com/mcp
    # Hotel metasearch. Search only; no booking path.
    - name: trivago
      registry: false
      transport: http
      url: https://mcp.trivago.com/mcp
    # AirBnB Search. Geocoding goes to Nominatim and Photon.
    - name: airbnb
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@openbnb/mcp-server-airbnb@0.3.0", "--ignore-robots-txt"]
    # Rate parity check across Trip.com, Booking.com, Agoda and Google Hotels.
    # Four read-only tools; no booking path.
    - name: hotelrate
      registry: false
      transport: stdio
      command: uvx
      args:
        - "--with"
        - "mcp[cli]<2"
        - "--from"
        - "git+https://github.com/seanbabalala/hotelrate-crawl@b60205201f002d649ef741fcfe1f6130123289e6"
        - "hotelrate-mcp"
