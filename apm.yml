name: llmctl
version: 0.1.0
description: Personal agent steering collection — repo-local development tooling.
author: siegenthalerroger
license: MIT AND CC-BY-SA-4.0

includes: auto

dependencies:
  apm:
    # This repository's own Python package, by local path: `scripts/` is the
    # only code here, and it is Python, so an agent working on this repo gets
    # the same steering a consumer of the package would. It deploys the two
    # local skills plus the upstream `modern-python` they pin.
    - ./packages/python
  mcp: []

# The marketplace lives in the sibling `.llmctl-marketplace` repository and
# holds nothing but generated output. Its README, LICENSE, .gitignore and
# apm.yml are produced from the `*.marketplace.*` sources beside this file.

# The lifecycle, in the order you would run it. Each entry is the whole command:
# `apm run` accepts no extra arguments, so anything needing a flag not written
# here calls the script directly. `uv run` reads each script's inline PEP 723
# header, so nothing has to be installed first.
scripts:
  # Every gate, over this workspace alone. The pre-PR check, and what CI runs.
  # Add `--since <ref>` by calling the script directly to lint a commit range;
  # without it that one gate is skipped, not failed.
  check: "uv run scripts/check.py --repo ."
  # Move the pinned upstreams and show the diff of everything that moved.
  # Commits nothing: the reading is the point. See the meta-update-repo skill.
  update: "uv run scripts/update.py --repo ."
  # The other half of updating: the files adapted from an upstream, and the
  # specifications cited. Read-only. `--specs` switches to the latter.
  check-updates: "uv run scripts/check_updates.py --repo ."
  # Which steering files were last touched before the guidance that governs
  # them moved. Read-only, and a reading order rather than a verdict: see the
  # meta-review-steering skill for what a `behind` row is worth.
  check-steering: "uv run scripts/check_steering.py --repo ."
  # What each package's next version would be, and why. Reads tags and commits.
  versions: "uv run scripts/versions.py --repo ."
  # What a release would publish, and its notes. The real release runs in CI,
  # on a push to main; this is the preview, and it writes nothing.
  release: "uv run scripts/release.py --repo . --marketplace ../.llmctl-marketplace --dry-run"
  # Regenerate the whole marketplace tree from this workspace, in place.
  pack-marketplace: "uv run scripts/pack_marketplace.py --repo . --marketplace ../.llmctl-marketplace --all"
