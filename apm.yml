name: llmctl
version: 0.1.0
description: Personal agent steering collection — repo-local development tooling.
author: siegenthalerroger
license: MIT AND CC-BY-SA-4.0

includes: auto

dependencies:
  apm: []
  mcp: []

# The marketplace lives in the sibling `.llmctl-marketplace` repository, and
# holds nothing but generated output: its README, LICENSE, .gitignore and
# apm.yml are produced from the `*.marketplace.*` sources beside this file.
#
# REDUCED FIDELITY vs `apm install`, only intended where the full fidelity of
# `apm install` is not available (e.g. in claude.ai's Cowork).
scripts:
  # These scripts release any repo laid out like this one, so both roots are
  # required rather than derived -- a guessed marketplace would silently
  # publish into the wrong repo. This file is what supplies them.
  #
  # Each entry is the whole command: `apm run` (0.28.0) accepts no extra
  # arguments, and rejects `--`, a bare flag and a positional alike. `--param`
  # is not a way round it -- it interpolates .prompt.md frontmatter, leaves a
  # shell command untouched, and is dropped in silence when nothing consumes
  # it. Any run needing a flag not written below calls the script directly.
  #
  # `uv run` reads each script's inline PEP 723 header, so the dependencies and
  # the interpreter come with the script rather than from a project-wide
  # environment. Nothing has to be installed first.
  #
  # Every gate, over this workspace alone. The pre-PR check, and what CI runs.
  # `--since` (the commit range the conventional-commit gate lints) needs the
  # script called directly; without it that one gate is skipped, not failed.
  check: "uv run scripts/check.py --repo ."
  # What each package's next version would be, and why. Reads tags and commits;
  # writes nothing. The same code release.py plans from.
  versions: "uv run scripts/versions.py --repo ."
  # Show what a release would publish. The real release runs in CI, on a push
  # to main; this is the preview, and it writes nothing.
  release: "uv run scripts/release.py --repo . --marketplace ../.llmctl-marketplace --dry-run"
  # Regenerate the whole marketplace tree from this workspace, in place.
  pack-marketplace: "uv run scripts/pack_marketplace.py --repo . --marketplace ../.llmctl-marketplace --all"
  # Regenerate THIRD-PARTY-NOTICES.md; --verify re-queries upstream licences.
  gen-notices: "uv run scripts/gen_notices.py --repo . --marketplace ../.llmctl-marketplace"
  # Check each file's licence against the upstream terms its provenance records.
  check-licenses: "uv run scripts/check_licenses.py --repo ."
  # Audit tracked files for upstream drift, in its broad default mode. The
  # meta-update-repo skill drives this and mostly wants --include, --specs or
  # --json, none of which `apm run` can carry: it calls the script directly.
  check-updates: "uv run scripts/check_updates.py --repo ."
