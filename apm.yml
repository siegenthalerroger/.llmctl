name: llmctl
version: 0.1.0
description: Personal agent steering collection — repo-local development tooling.
author: siegenthalerroger
license: MIT AND CC-BY-SA-4.0

includes: auto

dependencies:
  apm: []
  mcp: []

# The marketplace lives in the sibling `.llmctl-marketplace` repository.
# REDUCED FIDELITY vs `apm install`, only intended where the full fidelity of
# `apm install` is not available (e.g. in claude.ai's Cowork).
scripts:
  # These scripts release any repo laid out like this one, so both roots are
  # required rather than derived -- a guessed marketplace would silently
  # publish into the wrong repo. This file is what supplies them.
  #
  # Check the workspace itself: no marketplace, so it is the pre-PR gate.
  check: "python scripts/check.py --repo ."
  # Check what a release would publish. Needs the packed marketplace beside it.
  release-check: "python scripts/release-check.py --repo . --marketplace ../.llmctl-marketplace"
  # What each package's next version would be, and why. Reads tags and commit
  # subjects; writes nothing. The same code release.py plans from.
  versions: "python scripts/versions.py --repo ."
  # Derive each package's version from its commits, pack, commit, tag, push.
  release: "python scripts/release.py --repo . --marketplace ../.llmctl-marketplace"
  # Pack every package into the marketplace repo and regenerate its manifests.
  pack-marketplace: "python scripts/pack-marketplace.py --repo . --marketplace ../.llmctl-marketplace"
  # Regenerate THIRD-PARTY-NOTICES.md; --verify re-queries upstream licences.
  gen-notices: "python scripts/gen-notices.py --repo . --marketplace ../.llmctl-marketplace"
  # Check each file's licence against the upstream terms its provenance records.
  check-licenses: "python scripts/check-licenses.py --repo ."
  # Audit tracked files for upstream drift. The meta-upstream-sync skill drives
  # this; pass its flags after `--`.
  check-updates: "python scripts/check-updates.py --repo ."
