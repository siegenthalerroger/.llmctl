name: llmctl
version: 0.1.0
description: Personal agent steering collection — skills, agents, prompts, instructions
author: siegenthalerroger

# Include all items in the `/.apm` directory in this APM package.
includes: auto

dependencies:
  apm: []
  mcp:
    # shuymn/gh-mcp `gh` CLI extension: wraps the official github-mcp-server binary and reuses your `gh` login — no PAT needed.
    # Optional env: GITHUB_TOOLSETS, GITHUB_READ_ONLY, GITHUB_DYNAMIC_TOOLSETS.
    - name: github
      registry: false
      transport: stdio
      command: gh
      args: ["mcp"]
    # Documentation MCPs (read only)
    - name: opentofu-registry
      registry: false
      transport: streamable-http
      url: https://mcp.opentofu.org/mcp
    - name: microsoft.docs.mcp
      registry: false
      transport: streamable-http
      url: https://learn.microsoft.com/api/mcp
    - name: aws-knowledge-mcp
      registry: false
      transport: http
      url: https://knowledge-mcp.global.api.aws
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"

scripts: {}
