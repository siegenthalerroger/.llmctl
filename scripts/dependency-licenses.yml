  spdx: MIT
  holder: "Copyright (c) 2024 Pete Petrash"
  license_url: https://github.com/petekp/claude-code-setup/blob/main/LICENSE
  note: >-
    Only its `skills/typography` interface craft is adapted, merged with depot's
