  spdx: CC-BY-4.0
  holder: "David Aerne (meodai)"
  license_url: https://github.com/meodai/skill.color-expert/blob/main/LICENSE
  note: >-
    The LICENSE is the bare CC-BY-4.0 text with no copyright line; the holder
    above is attribution. Only the reasoning in its SKILL.md is adapted -- its
    ~190 reference files, npm tool catalogue, pigment-mixing and colour-naming
    material are not consumed. CC-BY-4.0 permits the CC-BY-SA-4.0 default that
    `*.md` takes here.

github.com/Myndex/apca-w3:
  spdx: W3C-20150513
  holder: "Copyright © 2019-2023 Andrew Somers and/or Myndex™. All Rights Reserved."
  license_url: https://github.com/Myndex/apca-w3/blob/master/LICENSE.md
  note: >-
    GitHub reports NOASSERTION: LICENSE.md is a stack of grants, not one licence.
    The operative permissive layer is the W3C Software and Document License
    (2015-05-13) = SPDX W3C-20150513, which the file links by URL. It is
    explicitly subordinated -- "SUBJECT TO THE ABOVE LISTED LIMITATIONS AND
    EXCLUSIONS" -- to restrictions that are NOT part of W3C-20150513: use limited
    to web content on self-illuminated displays, prohibited fields (medical,
    clinical, aerospace, transportation, military), no commercial use without a
    signed agreement, a right to audit paywalled integrations, a duty to keep
    current with the published constants, and trademark limits on the term
    "APCA". Non-web use cases fall back to the file's "AGPU v3" (AGPL-3.0). So
    W3C-20150513 alone OVERSTATES the grant; read the note before raising any
    fidelity here. We take only the published numeric constants of 0.1.9 G-4g,
    which are facts rather than protected expression -- hence inspiration-only,
    at which nothing attaches -- reimplemented in
    packages/design/.apm/skills/colour/scripts/check-contrast.py for screen and
    web contrast, inside the permitted field of use. The keep-current duty is why
    this is tracked as adaptedFrom (drift-audited) rather than authoritativeSpec.

