  spdx: Unlicense
  holder: "Travis Gertz / Design Machines Studio"
  license_url: https://github.com/Design-Machines-Studio/depot/blob/main/LICENSE
  note: >-
    Public-domain dedication, so nothing attaches. The LICENSE carries no
    copyright line -- the holder above is attribution, not a quoted notice.
    Only the `design-practice` plugin's layout, identity and dataviz skills are
    consumed; the repository is a much larger multi-domain marketplace.

