# --- Published works (no repository, so `not_trackable` in the drift audit) ---
#
# Books and articles are all-rights-reserved by default, hence `NONE`: usable
# only at `inspiration-only`, which is exactly what taking an idea from one is.
# Keyed by ISBN or by article URL so each work gets its own row -- gen-notices.py
# keeps the identifier in the slug for resolver hosts rather than collapsing them
# all onto `openlibrary.org`. `holder` doubles as the citation, because it is the
# only human-readable field in the Acknowledgements row.

